name: Auto Build
on:
  # schedule:
  #   # 每天 UTC 12:00（即北京时间 20:00）自动执行
  #   - cron: '0 12 * * *'
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer 版本（如 1.5.1、1.5.1-rc.1；也可填 1.5 会自动补 .0）"
        required: false
        type: string
      append_sha:
        description: "是否在版本末尾追加短 SHA（若已有 +build 会以 .sha 追加）"
        required: false
        default: "true"
        type: boolean

env:
  ANDROID_NDK_VERSION: r25c
  COMMIT_ID: "${{ github.sha }}"
  NO_BUILD_PROMPT: "no new commits, no need to build."
  NT_SIGN_URL: ${{ secrets.NT_SIGN_URL }}

jobs:
  commit-num-check:
    name: Check Commit Num
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get New Commits
        id: get-commits
        run: echo "NEW_COMMIT_COUNT=$(git log --oneline --since '24 hours ago' | wc -l)" >> $GITHUB_OUTPUT

      - name: Get Commit IDs
        id: get-commit-ids
        run: |
          echo "UI_CID=`cd sealdice-ui && git rev-parse HEAD`" >> $GITHUB_OUTPUT;
          echo "CORE_CID=`cd sealdice-core && git rev-parse HEAD`" >> $GITHUB_OUTPUT;
          echo "ANDROID_VERSION=`cd sealdice-android && git describe --tags --abbrev=0`" >> $GITHUB_OUTPUT;

      - name: Warning
        run: if [ $(git log --oneline --since '24 hours ago' | wc -l) <= 0 ]; then echo $NO_BUILD_PROMPT; fi

    outputs:
      commit-count: ${{ steps.get-commits.outputs.NEW_COMMIT_COUNT }}
      CORE_CID: ${{ steps.get-commit-ids.outputs.CORE_CID }}
      UI_CID: ${{ steps.get-commit-ids.outputs.UI_CID }}
      ANDROID_VERSION: ${{ steps.get-commit-ids.outputs.ANDROID_VERSION }}
      PROJECT_VERSION: ${{ steps.get-version.outputs.PROJECT_VERSION }}

  resources-download:
    name: Download Related Resources
    runs-on: ubuntu-latest
    needs: commit-num-check
    if: ${{ needs.commit-num-check.outputs.commit-count > 0 }}
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Upload Documents
        uses: actions/upload-artifact@v4
        with:
          name: documents
          path: ./sealdice-builtins/data

  lagrange-download:
    name: Download Lagrange
    runs-on: ubuntu-latest
    needs: commit-num-check
    if: ${{ needs.commit-num-check.outputs.commit-count > 0 }}
    steps:
      - name: Download
        run: |
          mkdir lag
          curl https://d1.sealdice.com/lagrange/0.0.6/Lagrange.OneBot_linux-arm64_8.0.zip?v=3 > lag/Lagrange.OneBot.linux-arm64.zip
          curl https://d1.sealdice.com/lagrange/0.0.6/Lagrange.OneBot_linux-x64_8.0.zip?v=3 > lag/Lagrange.OneBot.linux-amd64.zip
          curl https://d1.sealdice.com/lagrange/0.0.6/Lagrange.OneBot_win-x64_8.0.zip?v=3 > lag/Lagrange.OneBot.windows-amd64.zip
          curl https://d1.sealdice.com/lagrange/0.0.6/Lagrange.OneBot_win-x86_8.0.zip?v=3 > lag/Lagrange.OneBot.windows-386.zip
          curl https://d1.sealdice.com/lagrange/0.0.6/Lagrange.OneBot_osx-arm64_8.0.zip?v=3 > lag/Lagrange.OneBot.darwin-arm64.zip
          curl https://d1.sealdice.com/lagrange/0.0.6/Lagrange.OneBot_osx-x64_8.0.zip?v=3 > lag/Lagrange.OneBot.darwin-amd64.zip
          curl https://d1.sealdice.com/lagrange/0.0.6/Lagrange.OneBot_linux-musl-arm64_8.0.zip?v=3 > lag/Lagrange.OneBot.android-arm64.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lagrange
          path: ./lag

  lagrange-setup:
    name: Download Lagrange
    runs-on: ubuntu-latest
    needs: lagrange-download
    strategy:
      matrix:
        # target: linux/amd64, linux/arm64, windows/amd64, darwin/amd64, darwin/arm64
        goos: [ linux, windows, darwin ]
        goarch: [ '386', amd64, arm64 ]
        exclude:
          - goos: linux
            goarch: '386'
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: '386'
          - goos: darwin
            goarch: '386'


    steps:
      - name: Get Lagrange
        uses: actions/download-artifact@v4
        with:
          name: lagrange
          path: ./lagrange

      - name: Extract
        run: |
          mkdir extract
          ls ./lagrange/Lagrange.OneBot.${{ matrix.goos }}-${{ matrix.goarch }}.zip
          file ./lagrange/Lagrange.OneBot.${{ matrix.goos }}-${{ matrix.goarch }}.zip
          unzip ./lagrange/Lagrange.OneBot.${{ matrix.goos }}-${{ matrix.goarch }}.zip -d ./extract/Lagrange.OneBot.${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lagrange.${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./extract/Lagrange.OneBot.${{ matrix.goos }}-${{ matrix.goarch }}

  ui-build:
    name: Build UI
    runs-on: ubuntu-latest
    needs: commit-num-check
    if: ${{ needs.commit-num-check.outputs.commit-count > 0 }}
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get Commit ID
        run: |
          cd sealdice-ui
          echo "UI_CID=`git rev-parse --short HEAD`" >> $GITHUB_ENV;

      - name: Cache ui dist get
        id: cache-ui-dist
        uses: actions/cache@v4
        env:
          cache-name: cache-ui-dist
        with:
          path: ./sealdice-ui/dist
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ env.UI_CID }}

      - if: ${{ steps.cache-ui-dist.outputs.cache-hit == 'true' }}
        name: Show cache
        continue-on-error: true
        run: ls ./sealdice-ui/dist

      - name: Install Pnpm
        uses: pnpm/action-setup@v4
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        with:
          version: 10
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        with:
          node-version: 20
      - name: Install Dependencies
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        working-directory: ./sealdice-ui
        run: pnpm install
      - name: Build WebUI
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        working-directory: ./sealdice-ui
        run: pnpm run build-only

      - name: Upload UI
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-ui
          path: ./sealdice-ui/dist

  core-build:
    name: Build Core
    runs-on: ubuntu-latest
    needs: ui-build
    strategy:
      matrix:
        # target: linux/amd64, linux/arm64, windows/amd64
        goos: [ linux, windows ]
        goarch: [ '386', amd64, arm64 ]
        exclude:
          - goos: linux
            goarch: '386'
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: '386'
      fail-fast: true
    steps:
      - name: Apt-get Update
        run: sudo apt-get update
      - name: Code
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Cross-compiler for Windows
        if: matrix.goos == 'windows'
        run: sudo apt-get -y install mingw-w64
      - name: Install Cross-compiler for Linux Amd64 Musl
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: sudo apt-get -y install musl-tools
      - name: Install Cross-compiler for Linux Arm64 Musl
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          wget https://github.com/sealdice/tooolchain/releases/download/1/aarch64-linux-musl-cross.tgz;
          tar zxf aarch64-linux-musl-cross.tgz;
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sealdice-core/go.sum

      # copy from https://github.com/MetaCubeX/mihomo/blob/dbb002a5ba2e0e79158fd6e3264ac44aedf0bf72/.github/workflows/build.yml#L157-L173
      # modify from https://github.com/restic/restic/issues/4636#issuecomment-1896455557
      # this patch file only works on golang1.25.x
      # that means after golang1.25 release it must be changed
      # revert:
      # 693def151adff1af707d82d28f55dba81ceb08e1: "crypto/rand,runtime: switch RtlGenRandom for ProcessPrng"
      # 7c1157f9544922e96945196b47b95664b1e39108: "net: remove sysSocket fallback for Windows 7"
      # 48042aa09c2f878c4faa576948b07fe625c4707a: "syscall: remove Windows 7 console handle workaround"
      # a17d959debdb04cd550016a3501dd09d50cd62e7: "runtime: always use LoadLibraryEx to load system libraries"
      # 534d6a1a9c81b25bdad1052e736b2f072caa3903: "crypto/rand: prevent Read argument from escaping to heap"
      # see:https://github.com/XTLS/go-win7/blob/dc94f3421137d9a6327b281dd401c2c489b04cbb/README-zho-hans.md
      - name: Revert Golang1.25 commit for Windows7/8
        if: ${{ matrix.goos == 'windows' }}
        run: |
          cd $(go env GOROOT)
          patch --verbose -p 1 < $GITHUB_WORKSPACE/.github/patch_go/unified-1-25-patch.diff

      - name: Install Dependencies
        working-directory: ./sealdice-core
        run: |
          go mod tidy
          go get .
      - name: Get UI Resources
        uses: actions/download-artifact@v4
        with:
          name: sealdice-ui
          path: ./sealdice-core/static/frontend

      - name: Get current time
        uses: Kaven-Universe/github-action-current-date-time@v1
        id: currentTime
        with:
          format: YYYYMMDD
          timezone-offset: -480

      - name: Derive version (SemVer)
        id: ver
        env:
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
          COMMIT_ID: ${{ env.COMMIT_ID }}
        run: |
          set -euo pipefail

          short_sha="${COMMIT_ID::7}"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            V_IN="${{ github.event.inputs.version }}"
            V_IN="${V_IN#v}"

            if echo "$V_IN" | grep -Eq '^[0-9]+\.[0-9]+$'; then
              V_IN="${V_IN}.0"
            fi

            V="$V_IN"

            if [ "${{ github.event.inputs.append_sha }}" = "true" ]; then
              if echo "$V" | grep -q '+'; then
                V="${V}.${short_sha}"
              else
                V="${V}+${short_sha}"
              fi
            fi
          else
            V="1.5.0-dev+${CUR_TIME}.${short_sha}"
          fi

          PRERELEASE="$(printf '%s' "$V" | sed -n 's/^[0-9]\+\.[0-9]\+\.[0-9]\+-\([^+]*\).*$/\1/p')"
          BUILD="$(printf '%s' "$V" | sed -n 's/^[0-9]\+\.[0-9]\+\.[0-9]\+[^+]*+\(.*\)$/\1/p')"

          [ -n "$PRERELEASE" ] && PR="-${PRERELEASE}" || PR=""
          [ -n "$BUILD" ] && BM="+${BUILD}" || BM=""

          echo "VERSION=$V"                >> $GITHUB_OUTPUT
          echo "PRERELEASE_WITH_SIGNS=$PR" >> $GITHUB_OUTPUT
          echo "BUILD_WITH_SIGNS=$BM"      >> $GITHUB_OUTPUT

          echo "Final version: $V"
      - name: Set Env
        working-directory: ./sealdice-core
        run: |
          echo "PROJECT_VERSION_C=${{ steps.ver.outputs.VERSION }}" >> $GITHUB_ENV;
      - name: Build Binary
        if: matrix.goos != 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GO111MODULE: on
          CGO_ENABLED: ${{ matrix.goos == 'windows' && 1 || 0 }}
          CGO_FLAGS: -Werror=unused-variable -Werror=implicit-function-declaration -O2 -H=windowsgui
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
          SEAL_TRUSTED_PRIVATE_KEY: ${{ secrets.SEAL_TRUSTED_PRIVATE_KEY }}
        working-directory: ./sealdice-core
        run: go build -o "output/$BINARY_NAME" -trimpath -ldflags "-s -w -X sealdice-core/dice.VERSION_PRERELEASE=-dev -X sealdice-core/dice.VERSION_BUILD_METADATA=+${CUR_TIME}.${COMMIT_ID::7} -X sealdice-core/dice.APP_CHANNEL=dev -X 'sealdice-core/dice.DefaultSignUrl=${NT_SIGN_URL}' -X 'sealdice-core/dice.SealTrustedClientPrivateKey=${SEAL_TRUSTED_PRIVATE_KEY}'" .
      - name: Build Binary (linux musl)
        if: matrix.goos == 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GO111MODULE: on
          CGO_ENABLED: 1
          CGO_FLAGS: -Werror=unused-variable -Werror=implicit-function-declaration -O2 -H=windowsgui
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
          SEAL_TRUSTED_PRIVATE_KEY: ${{ secrets.SEAL_TRUSTED_PRIVATE_KEY }}
        working-directory: ./sealdice-core
        run: go build -tags musl -o "output/$BINARY_NAME" -trimpath -ldflags "-s -w -linkmode external -extldflags '-static' -X sealdice-core/dice.VERSION_PRERELEASE=-dev -X sealdice-core/dice.VERSION_BUILD_METADATA=+${CUR_TIME}.${COMMIT_ID::7} -X sealdice-core/dice.APP_CHANNEL=dev -X 'sealdice-core/dice.DefaultSignUrl=${NT_SIGN_URL}' -X 'sealdice-core/dice.SealTrustedClientPrivateKey=${SEAL_TRUSTED_PRIVATE_KEY}'" .
      - name: Run UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: ./sealdice-core/output/${{ env.BINARY_NAME }}
          args: -9 -fq
      - name: Upload Core
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION_C }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ./sealdice-core/output
  core-darwin-build:
    name: Build Core
    runs-on: macos-latest
    needs: ui-build
    strategy:
      matrix:
        # target: darwin/amd64 darwin/arm64
        goos: [ darwin ]
        goarch: [ amd64, arm64 ]
      fail-fast: true
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sealdice-core/go.sum
      - name: Install dependencies
        working-directory: ./sealdice-core
        run: |
          go mod tidy
          go get .
      - name: Get UI Resources
        uses: actions/download-artifact@v4
        with:
          name: sealdice-ui
          path: ./sealdice-core/static/frontend

      - name: Get current time
        uses: Kaven-Universe/github-action-current-date-time@v1
        id: currentTime
        with:
          format: YYYYMMDD
          timezone-offset: -480

      - name: Derive version (SemVer)
        id: ver
        env:
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
          COMMIT_ID: ${{ env.COMMIT_ID }}
        run: |
          set -euo pipefail

          short_sha="${COMMIT_ID::7}"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            V_IN="${{ github.event.inputs.version }}"
            V_IN="${V_IN#v}"

            if echo "$V_IN" | grep -Eq '^[0-9]+\.[0-9]+$'; then
              V_IN="${V_IN}.0"
            fi

            V="$V_IN"

            if [ "${{ github.event.inputs.append_sha }}" = "true" ]; then
              if echo "$V" | grep -q '+'; then
                V="${V}.${short_sha}"
              else
                V="${V}+${short_sha}"
              fi
            fi
          else
            V="1.5.0-dev+${CUR_TIME}.${short_sha}"
          fi

          PRERELEASE="$(printf '%s' "$V" | sed -n 's/^[0-9]\+\.[0-9]\+\.[0-9]\+-\([^+]*\).*$/\1/p')"
          BUILD="$(printf '%s' "$V" | sed -n 's/^[0-9]\+\.[0-9]\+\.[0-9]\+[^+]*+\(.*\)$/\1/p')"

          [ -n "$PRERELEASE" ] && PR="-${PRERELEASE}" || PR=""
          [ -n "$BUILD" ] && BM="+${BUILD}" || BM=""

          echo "VERSION=$V"                >> $GITHUB_OUTPUT
          echo "PRERELEASE_WITH_SIGNS=$PR" >> $GITHUB_OUTPUT
          echo "BUILD_WITH_SIGNS=$BM"      >> $GITHUB_OUTPUT

          echo "Final version: $V"
      - name: Set Env
        working-directory: ./sealdice-core
        run: |
          echo "PROJECT_VERSION_C=${{ steps.ver.outputs.VERSION }}" >> $GITHUB_ENV;
      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GO111MODULE: on
          CGO_ENABLED: 1
          CGO_FLAGS: -Werror=unused-variable -Werror=implicit-function-declaration -O2 -mmacosx-version-min=10.12
          CGO_CFLAGS: -mmacosx-version-min=10.12
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
          SEAL_TRUSTED_PRIVATE_KEY: ${{ secrets.SEAL_TRUSTED_PRIVATE_KEY }}
        working-directory: ./sealdice-core
        run: go build -o "output/sealdice-core" -trimpath -ldflags "-s -w -X sealdice-core/dice.VERSION_PRERELEASE=-dev -X sealdice-core/dice.VERSION_BUILD_METADATA=+${CUR_TIME}.${COMMIT_ID::7} -X sealdice-core/dice.APP_CHANNEL=dev  -X 'sealdice-core/dice.DefaultSignUrl=${NT_SIGN_URL}' -X 'sealdice-core/dice.SealTrustedClientPrivateKey=${SEAL_TRUSTED_PRIVATE_KEY}'" .
      - name: Upload Core
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION_C }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ./sealdice-core/output
  pc-pack:
    name: PC Pack
    runs-on: ubuntu-latest
    needs:
      - resources-download
      # - gocqhttp-build
      - core-build
      - core-darwin-build
      - lagrange-setup
    strategy:
      matrix:
        # target: linux/amd64, linux/arm64, windows/amd64, darwin/amd64, darwin/arm64
        goos: [ linux, windows, darwin ]
        goarch: [ '386', amd64, arm64 ]
        exclude:
          - goos: linux
            goarch: '386'
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: '386'
          - goos: darwin
            goarch: '386'
    steps:
      - name: Get current time
        uses: Kaven-Universe/github-action-current-date-time@v1
        id: currentTime
        with:
          format: YYYYMMDD
          timezone-offset: -480
      - name: Derive version (SemVer)
        id: ver
        env:
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
          COMMIT_ID: ${{ env.COMMIT_ID }}
        run: |
          set -euo pipefail

          short_sha="${COMMIT_ID::7}"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            V_IN="${{ github.event.inputs.version }}"
            V_IN="${V_IN#v}"

            if echo "$V_IN" | grep -Eq '^[0-9]+\.[0-9]+$'; then
              V_IN="${V_IN}.0"
            fi

            V="$V_IN"

            if [ "${{ github.event.inputs.append_sha }}" = "true" ]; then
              if echo "$V" | grep -q '+'; then
                V="${V}.${short_sha}"
              else
                V="${V}+${short_sha}"
              fi
            fi
          else
            V="1.5.0-dev+${CUR_TIME}.${short_sha}"
          fi

          PRERELEASE="$(printf '%s' "$V" | sed -n 's/^[0-9]\+\.[0-9]\+\.[0-9]\+-\([^+]*\).*$/\1/p')"
          BUILD="$(printf '%s' "$V" | sed -n 's/^[0-9]\+\.[0-9]\+\.[0-9]\+[^+]*+\(.*\)$/\1/p')"

          [ -n "$PRERELEASE" ] && PR="-${PRERELEASE}" || PR=""
          [ -n "$BUILD" ] && BM="+${BUILD}" || BM=""

          echo "VERSION=$V"                >> $GITHUB_OUTPUT
          echo "PRERELEASE_WITH_SIGNS=$PR" >> $GITHUB_OUTPUT
          echo "BUILD_WITH_SIGNS=$BM"      >> $GITHUB_OUTPUT

          echo "Final version: $V"
      - name: Set Env
        run: |
          echo "PROJECT_VERSION_C=${{ steps.ver.outputs.VERSION }}" >> $GITHUB_ENV;
      - name: Get Documents
        uses: actions/download-artifact@v4
        with:
          name: documents
          path: ./data

      - name: Get Lagrange
        uses: actions/download-artifact@v4
        with:
          name: lagrange.${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./lagrange/

      - name: Get Lagrange-Gocq
        uses: actions/download-artifact@v4
        with:
          name: lagrange-gocq.${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./lagrange/

      - name: Get Core
        uses: actions/download-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION_C }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: .

      - name: Set Execute Attribute
        if: matrix.goos != 'windows'
        run: chmod +x ./sealdice-core

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sealdice_${{ env.PROJECT_VERSION_C }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: .
